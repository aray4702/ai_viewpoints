[project]
name = "their-take"
version = "0.1.0"
description = "Their Take: what people think, with sources."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlite-vec>=0.1.6",
    "huey>=2.5",
    "httpx>=0.27",
    "feedparser>=6.0",
    "youtube-transcript-api>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "voyageai>=0.3",
    "lark>=1.2",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "itsdangerous>=2.2.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/param markers are meant to be used as argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
